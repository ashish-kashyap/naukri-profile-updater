name: Naukri Profile Auto-Updater

on:
  schedule:
    # Runs at 03:30 UTC daily = 09:00 AM IST
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (inspect only, do not save)'
        required: false
        type: boolean
        default: false
      skip_resume:
        description: 'Skip resume upload (update headline only)'
        required: false
        type: boolean
        default: false
      skip_headline:
        description: 'Skip headline update (upload resume only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: naukri-updater
  cancel-in-progress: false

jobs:
  update_profile:
    name: Refresh Naukri Profile
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Naukri Profile Updater
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          RESUME_BASE64: ${{ secrets.RESUME_BASE64 }}
          HEADLINE_VARIANT_A: ${{ secrets.HEADLINE_VARIANT_A }}
          HEADLINE_VARIANT_B: ${{ secrets.HEADLINE_VARIANT_B }}
          HEADLESS: 'true'
          SEND_NOTIFICATIONS: 'false'
        run: |
          $extraArgs = @()
          if ('${{ github.event.inputs.dry_run }}' -eq 'true') { $extraArgs += '--dry-run' }
          if ('${{ github.event.inputs.skip_resume }}' -eq 'true') { $extraArgs += '--skip-resume' }
          if ('${{ github.event.inputs.skip_headline }}' -eq 'true') { $extraArgs += '--skip-headline' }
          python update_profile.py $extraArgs

      - name: Upload Logs & Debug Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            logs/
            screenshots/
          retention-days: 7
