name: Naukri Profile Auto-Updater

on:
  schedule:
    # Runs at 03:30 UTC daily = 09:00 AM IST
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (inspect only, do not save)'
        required: false
        type: boolean
        default: false
      skip_resume:
        description: 'Skip resume upload (update headline only)'
        required: false
        type: boolean
        default: false
      skip_headline:
        description: 'Skip headline update (upload resume only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: naukri-updater
  cancel-in-progress: false

jobs:
  update_profile:
    name: Refresh Naukri Profile
    runs-on: ubuntu-latest        # Linux + Xvfb = headed Chrome without a real monitor
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies & system libs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Start Xvfb virtual display
        # Xvfb provides a headless X11 display so Chrome can run in headed mode
        # without a physical monitor — bypassing Naukri's CDN bot detection.
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1366x768x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Run Naukri Profile Updater
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          RESUME_BASE64: ${{ secrets.RESUME_BASE64 }}
          HEADLINE_VARIANT_A: ${{ secrets.HEADLINE_VARIANT_A }}
          HEADLINE_VARIANT_B: ${{ secrets.HEADLINE_VARIANT_B }}
          HEADLESS: 'false'       # Headed mode — Akamai cannot detect this as a bot
          SEND_NOTIFICATIONS: 'false'
          OTP_TIMEOUT_SEC: '120'
          DISPLAY: ':99'          # Point Chrome at the Xvfb virtual display
        run: |
          extra_args=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then extra_args="$extra_args --dry-run"; fi
          if [ "${{ github.event.inputs.skip_resume }}" = "true" ]; then extra_args="$extra_args --skip-resume"; fi
          if [ "${{ github.event.inputs.skip_headline }}" = "true" ]; then extra_args="$extra_args --skip-headline"; fi
          python update_profile.py $extra_args

      - name: Upload Logs & Debug Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            logs/
            screenshots/
          retention-days: 7
